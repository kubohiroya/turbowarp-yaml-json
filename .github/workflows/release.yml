name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Create ZIP archive
        run: |
          cd dist
          zip ../turbowarp-extension.zip *.js
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.js
            turbowarp-extension.zip

  publish-existing:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.21.0
      - name: Verify release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package.json')); if (p.name !== '@kubohiroya/turbowarp-yaml-json' || p.version !== '0.5.0') throw new Error('Main has advanced');"
          gh release download v0.5.0 --repo kubohiroya/turbowarp-yaml-json --pattern kubohiroya-turbowarp-yaml-json-0.5.0.tgz
          echo '4065b9d3f4f942a264c1b974c87185817f770e3d  kubohiroya-turbowarp-yaml-json-0.5.0.tgz' | sha1sum --check
          tar -xOf kubohiroya-turbowarp-yaml-json-0.5.0.tgz package/package.json > package-metadata.json
          node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package-metadata.json')); if (p.name !== '@kubohiroya/turbowarp-yaml-json' || p.version !== '0.5.0') throw new Error('Unexpected package');"
      - name: Publish once with provenance and finalize tags
        run: |
          set -eu
          npm view @kubohiroya/turbowarp-yaml-json@0.5.0 --json --prefer-online > published.json 2> registry-error.txt || {
            node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('published.json')); if (p.error?.code !== 'E404') throw new Error('Registry lookup failed');"
            npm publish ./kubohiroya-turbowarp-yaml-json-0.5.0.tgz --access public --provenance --tag latest --ignore-scripts
          }
          npm view @kubohiroya/turbowarp-yaml-json@0.5.0 dist.shasum --json --prefer-online > visible-hash.json 2>/dev/null || true
          node --input-type=module -e "import fs from 'node:fs'; const t=fs.readFileSync('visible-hash.json','utf8').trim(); if(t){ const p=JSON.parse(t); if(!p.error && p!=='4065b9d3f4f942a264c1b974c87185817f770e3d') throw new Error('Published artifact differs'); if(p.error && p.error.code!=='E404') throw new Error('Registry lookup failed'); }"
          node scripts/finalize-release-tags.ts @kubohiroya/turbowarp-yaml-json 0.5.0
          npm view @kubohiroya/turbowarp-yaml-json@0.5.0 dist.shasum --json --prefer-online > published-hash.json
          node --input-type=module -e "import fs from 'node:fs'; if (JSON.parse(fs.readFileSync('published-hash.json')) !== '4065b9d3f4f942a264c1b974c87185817f770e3d') throw new Error('Published artifact differs');"
